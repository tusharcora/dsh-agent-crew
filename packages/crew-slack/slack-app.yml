# Slack app manifest for crew-slack. At https://api.slack.com/apps choose
# "Create New App" > "From an app manifest", pick your workspace and paste this file.
# Socket Mode means Slack never calls into this computer: dsh opens the connection.
display_information:
  name: Crew
  description: Your dsh crew. Replies are posted only after you approve them.
  background_color: "#1d1d1f"
features:
  bot_user:
    display_name: Crew
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      # Receive @Crew mentions in channels the app was added to.
      - app_mentions:read
      # Post approved replies and the approval cards.
      - chat:write
      # Read your direct messages to the app and open a direct message for approval cards.
      - im:history
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
