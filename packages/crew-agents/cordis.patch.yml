# Crew: five specialist presets, a Chief of staff preset that delegates to them, and the browser roster.
# Each specialist's model is the `agentOptions` of its `ask_*` row in the Chief preset; unset rows use the
# Session's model. Every preset runs its tools through run_code (PTC), mounts the crew write guard and reads its own
# approved lessons from crew-improve. MCP rows read
# secrets from the credential store; `disabled` rows wait for an account the user has not approved yet.
- insert:
    - id: crew-connections
      name: '@deepseek-ai/dsh-experimental-crew-connections'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-improve
      name: '@deepseek-ai/dsh-experimental-crew-improve'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-faces
      name: '@deepseek-ai/dsh-experimental-crew-faces'
    - id: crew-agents-ui
      name: '@deepseek-ai/dsh-experimental-crew-agents-ui'
    - id: preset-crew-chief
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-chief
        name: Chief of staff
        description: Plans your day and hands work to Mail, Chat, Code, Research and Life.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the user's chief of staff, powered by the {{model}} model. You lead a crew of five specialists and own the plan, not the details.
                Delegate each piece of work to the specialist that fits with its ask_* tool: ask_mail for email, ask_chat for messages, ask_code for repositories and pull requests, ask_research for questions that need sources, ask_life for calendar, errands and reminders. Give each one a self-contained task with the outcome you need.
                When Agent Teams is on, put multi-step work on the task board and assign each task to the specialist doing it.
                Nothing is sent, posted, bought, deleted, merged or booked without the user's explicit approval. Report what each specialist found, with its sources, and say clearly what still needs the user.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-chief
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: ask-mail
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: ask_mail
              agentPreset: crew-mail
          - id: ask-chat
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: ask_chat
              agentPreset: crew-chat
          - id: ask-code
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: ask_code
              agentPreset: crew-code
          - id: ask-research
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: ask_research
              agentPreset: crew-research
          - id: ask-life
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: ask_life
              agentPreset: crew-life
    - id: preset-crew-mail
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-mail
        name: Mail
        description: Reads and triages email and drafts replies for your approval.
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Mail, the crew's email specialist, powered by the {{model}} model. You triage, summarize and draft.
                You never send, delete or archive anything yourself: you prepare drafts and the user approves them. Quote the sender, subject and date of every message you rely on.
                If no mailbox is connected, say so plainly instead of guessing at its contents.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-mail
          - id: mcp-gmail
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: gmail
              url: 'https://gmailmcp.googleapis.com/mcp/v1'
              headers:
                Authorization: 'Bearer ${credential:CREW_GOOGLE_ACCESS_TOKEN}'
              expandTemplates: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
    - id: preset-crew-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-chat
        name: Chat
        description: Keeps up with your conversations and drafts replies for your approval.
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Chat, the crew's messaging specialist, powered by the {{model}} model. You follow threads, summarize what changed and draft replies in the user's voice.
                You never post or send anything yourself: the user approves every message. Name the channel, the person and the time of every message you rely on.
                If no chat account is connected, say so plainly instead of guessing.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-chat
          - id: mcp-slack
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              transport: streamable-http
              serverName: slack
              url: 'https://mcp.slack.com/mcp'
              headers:
                Authorization: 'Bearer ${credential:CREW_SLACK_TOKEN}'
              expandTemplates: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
    - id: preset-crew-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-code
        name: Code
        description: Works in your repositories, reviews pull requests and runs checks.
        order: 23
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Code, the crew's engineering specialist, powered by the {{model}} model. You read, change and test code in the user's repositories.
                You may edit files and run commands in the workspace. You never merge, push to a shared branch, publish or delete remote resources yourself: prepare the change and the user approves it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-code
          - id: mcp-github
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: github
              url: 'https://api.githubcopilot.com/mcp/'
              headers:
                Authorization: 'Bearer ${credential:CREW_GITHUB_TOKEN}'
                X-MCP-Readonly: 'true'
              expandTemplates: true
          - id: mcp-cloudflare-docs
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: cloudflare-docs
              url: 'https://docs.mcp.cloudflare.com/mcp'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
    - id: preset-crew-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-research
        name: Research
        description: Answers questions from cited sources.
        order: 24
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Research, the crew's analyst, powered by the {{model}} model. You answer questions from sources you actually read.
                Cite the source and its date for every fact, price or score, say when sources disagree, and say when you could not find something instead of filling the gap.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-research
          - id: mcp-firecrawl
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: firecrawl
              url: 'https://mcp.firecrawl.dev/v2/mcp'
          - id: mcp-cloudflare-docs
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: cloudflare-docs
              url: 'https://docs.mcp.cloudflare.com/mcp'
          - id: mcp-exa
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              transport: streamable-http
              serverName: exa
              url: 'https://mcp.exa.ai/mcp?exaApiKey=${credential:CREW_EXA_API_KEY}'
              expandTemplates: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
    - id: preset-crew-life
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crew-life
        name: Life
        description: Keeps track of your calendar, errands and reminders.
        order: 25
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Life, the crew's personal assistant, powered by the {{model}} model. You keep track of plans, errands and reminders.
                You may create reminders with the schedule tools after the user agrees to them. You never buy or book anything yourself: you prepare the details and the user approves them.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: crew-write-guard
            name: '@deepseek-ai/dsh-experimental-crew-connections/guard'
          - id: crew-lessons
            name: '@deepseek-ai/dsh-experimental-crew-improve/lessons'
            config:
              member: crew-life
          - id: mcp-gcal
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: gcal
              url: 'https://calendarmcp.googleapis.com/mcp/v1'
              headers:
                Authorization: 'Bearer ${credential:CREW_GOOGLE_ACCESS_TOKEN}'
              expandTemplates: true
          - id: mcp-obsidian
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              transport: stdio
              serverName: obsidian
              command: npx
              args:
                - '-y'
                - '@modelcontextprotocol/server-filesystem'
                - '${credential:CREW_OBSIDIAN_VAULT}'
              expandTemplates: true
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
