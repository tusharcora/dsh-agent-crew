# Crew, the one plugin for everything crew: the roster (crew-roster registers one agent preset per member from
# ~/.dsh/crew/members.json, seeded with a Chief of staff and the specialists), the browser roster, the crew pages,
# the stock chart, the Desktop tab and the Today page. Every member runs its tools through
# run_code (PTC), mounts the crew write guard and reads its own approved lessons from crew-improve. MCP rows read
# secrets from the credential store; connections whose account the user has not approved stay off.
- insert:
    - id: crew-connections
      name: '@deepseek-ai/dsh-crew-connections'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-improve
      name: '@deepseek-ai/dsh-crew-improve'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-roster
      name: '@deepseek-ai/dsh-crew-roster'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-slack
      name: '@deepseek-ai/dsh-crew-slack'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-faces
      name: '@deepseek-ai/dsh-crew-faces'
    - id: crew-agents-ui
      name: '@deepseek-ai/dsh-crew-agents-ui'
    - id: crew-chain-of-thought
      name: '@deepseek-ai/dsh-crew-chain-of-thought'
    - id: crew-kanban
      name: '@deepseek-ai/dsh-crew-kanban'
    - id: crew-kanban-ui
      name: '@deepseek-ai/dsh-crew-kanban-ui'
    - id: crew-handoff-ui
      name: '@deepseek-ai/dsh-crew-handoff-ui'
    - id: crew-tool-map-ui
      name: '@deepseek-ai/dsh-crew-tool-map-ui'
    - id: crew-workflows
      name: '@deepseek-ai/dsh-crew-workflows'
      config:
        homeDirectory: !!js dshHomePath('crew')
    - id: crew-workflows-ui
      name: '@deepseek-ai/dsh-crew-workflows-ui'
    - id: crew-stock-chart
      name: '@deepseek-ai/dsh-crew-stock-chart'
    - id: crew-stock-chart-ui
      name: '@deepseek-ai/dsh-crew-stock-chart-ui'
    - id: crew-desktop
      name: '@deepseek-ai/dsh-crew-desktop'
    - id: crew-desktop-ui
      name: '@deepseek-ai/dsh-crew-desktop-ui'
    - id: crew-today
      name: '@deepseek-ai/dsh-crew-today'
    - id: crew-today-ui
      name: '@deepseek-ai/dsh-crew-today-ui'
